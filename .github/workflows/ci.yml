name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: oote

      - uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac

      - uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar

      - uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std

      - name: Require compiler and clang
        working-directory: ${{ github.workspace }}
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          if ! command -v clang >/dev/null; then sudo apt-get update && sudo apt-get install -y clang; fi
          command -v clang >/dev/null || { echo "clang required for oodac build (LLVM IR + oodar)"; exit 1; }

      - name: Build oodar libs
        working-directory: ${{ github.workspace }}
        run: make -C oodar/scripts -f Makefile modular

      - name: Build, verify, and test
        working-directory: ${{ github.workspace }}/oote
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: "1"
        run: |
          mkdir -p ~/.openooda
          make verify
          make build
          make test

      - name: Verify packaging (.deb & .rpm)
        working-directory: ${{ github.workspace }}/oote
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm dpkg
          make package-deb
          make package-rpm
          ls -la dist/*.deb dist/*.rpm
          sudo dpkg -i dist/oote_*_amd64.deb
          /usr/bin/oote --version
          /usr/bin/oote list
          /usr/bin/oote current
          /usr/bin/oote preview ember --light --border double
          /usr/bin/oote glyph minimax idle
          /usr/bin/oote get status_success

      - name: Verify PKGBUILD, installer, and uninstaller
        working-directory: ${{ github.workspace }}/oote
        run: |
          test -f packaging/arch/PKGBUILD
          grep -q "pkgname=oote" packaging/arch/PKGBUILD
          bash install.sh --help
          bash install.sh --dry-run
          bash install.sh --uninstall --dry-run
          bash install.sh --uninstall --dry-run --purge
          bash uninstall.sh --help
          bash uninstall.sh --dry-run
          bash uninstall.sh --dry-run --purge
          /usr/bin/oote-uninstall --help
          /usr/bin/oote-uninstall --dry-run
